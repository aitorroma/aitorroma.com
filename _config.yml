title: Aitor Roma
email: aitor@nimbox360.com
description: Forward Deployed Engineer, Cloud & SRE Architect especializado en sistemas Linux, observabilidad, automatización e IA aplicada a operaciones.
baseurl: ""
url: "https://aitorroma.com"
twitter_username: tuxed
github_username: aitorroma

markdown: kramdown
permalink: /:year/:month/:day/:title
theme: minima
plugins:
  - jekyll-feed

sass:
  sass_dir: assets/css
  style: compressed

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: ""
    values:
      layout: "default"

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
