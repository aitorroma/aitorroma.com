---
layout: default
---

<div class="project-page">
    <div class="container">
        <a href="{{ '/#proyectos' | relative_url }}" style="display:inline-block;margin:24px 0">← Volver a los proyectos de aitorOS</a>
        {% if page.image %}
        <img src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" style="display:block;width:100%;max-height:380px;object-fit:contain;border-radius:16px;margin-bottom:28px;background:#f4f6f8">
        {% endif %}
        {{ content }}
    </div>
</div>
